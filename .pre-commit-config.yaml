repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning, --external-sources]
        # zsh/.zshrc uses zsh-only syntax (e.g. anonymous `() { ... }`
        # functions) that shellcheck's sh/bash/dash/ksh parser can't
        # parse (SC1073); shellcheck has no zsh dialect to switch to.
        exclude: ^zsh/\.zshrc$

  - repo: local
    hooks:
      - id: stow-dry-run
        name: stow -n -v (dry-run all packages)
        entry: bash -c 'stow --no-folding -n -v -d "$(git rev-parse --show-toplevel)" -t "$HOME" starship tmux nvim git zsh bash bin functions vscode firefox'
        language: system
        pass_filenames: false
        always_run: true

      - id: stow-dry-run-ssh
        name: stow -n -v (dry-run private ssh linkage)
        entry: bash -c 'root="$(git rev-parse --show-toplevel)"; if [ -d "$root/private/config/ssh" ]; then stow --no-folding -n -v -d "$root/private/config" -t "$HOME/.ssh" ssh; else echo "private submodule not checked out, skipping ssh stow dry-run"; fi'
        language: system
        pass_filenames: false
        always_run: true

      - id: stow-dry-run-private-bin
        name: stow -n -v (dry-run private bin linkage)
        entry: bash -c 'root="$(git rev-parse --show-toplevel)"; if [ -d "$root/private/bin" ]; then stow --no-folding -n -v -d "$root/private" -t "$HOME" bin; else echo "private submodule not checked out, skipping private-bin stow dry-run"; fi'
        language: system
        pass_filenames: false
        always_run: true

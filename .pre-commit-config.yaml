repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning, --external-sources]
        # zsh/.zshrc uses zsh-only syntax (e.g. anonymous `() { ... }`
        # functions) that shellcheck's sh/bash/dash/ksh parser can't
        # parse (SC1073); shellcheck has no zsh dialect to switch to.
        exclude: ^zsh/\.zshrc$

  - repo: local
    hooks:
      - id: stow-dry-run
        name: stow -n -v (dry-run all packages)
        entry: bash -c 'stow -n -v -d "$(git rev-parse --show-toplevel)" -t "$HOME" starship tmux nvim git zsh bash bin functions'
        language: system
        pass_filenames: false
        always_run: true

# General settings
set -g mouse on
set -g history-limit 10000
set -g default-terminal "screen-256color"
set -s escape-time 0
set-window-option -g automatic-rename

set -g status-bg black
set -g status-fg white

# Vi mode
set-window-option -g mode-keys vi

# Vi-style selection
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

# Vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split windows and preserve current path
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Reload config
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Copy mode styling
setw -g mode-style 'fg=black bg=lightblue bold'

# Clipboard integration (macOS vs Linux)
if-shell "uname | grep -q Darwin" {
  bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
  bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
} {
  set -s copy-command 'wl-copy'
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy && wl-paste -n | wl-copy -p"
  bind-key p run "wl-paste -n | tmux load-buffer - ; tmux paste-buffer"
}

# Disable bells and notifications
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Status bar
set -g status-position bottom
set -g status-left-length 80
set -g status-right '[ #(whoami)@#H - #[fg=blue]%d-%m-%Y %H:%M ]'
set -g message-style 'fg=lightblue bg=black bold'
setw -g clock-mode-colour lightblue

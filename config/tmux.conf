# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

setw -g clock-mode-colour red

bind-key r source-file ~/.dotfiles/config/tmux.conf \; display-message "~/.tmux.conf reloaded"

# copy mode
setw -g mode-style 'fg=black bg=lightblue bold'

# Copy to MacOS or xclip
if-shell "uname | grep -q Darwin" {
  bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
  bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
} {
  bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
  bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
}

# panes
set -g pane-border-style 'fg=blue'
set -g pane-active-border-style 'fg=lightblue'

# statusbar
set -g status-position bottom
set -g status-justify center
set -g status-style 'fg=blue'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=lightblue'
set -g status-right '%Y-%m-%d %H:%M'
set -g status-right-length 100

setw -g window-status-current-style 'fg=black bg=lightblue'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=lightblue bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=lightblue bg=black bold'

# windows
set-window-option -g automatic-rename

# This makes emacs evil-mode work with no delay
set -s escape-time 0

# Variable for the TERM env-var
set -g default-terminal "screen-256color"
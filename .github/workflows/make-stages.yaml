name: Make all stages

# Run this workflow every time a new commit pushed to your repository
on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - master

jobs:
  stow:
    name: Verify stow packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Install dependencies'
        run: sudo apt-get update && sudo apt-get install -y stow
      - name: 'Place checkout at ~/.dotfiles'
        run: ln -sf "${{ github.workspace }}" "${HOME}/.dotfiles"
      - name: 'Clone private submodule'
        run: git -C ~/.dotfiles submodule update --init --recursive private
        continue-on-error: true
      - name: 'stow -n -v across all packages'
        run: |
          cd ~/.dotfiles
          stow --no-folding -n -v -d ~/.dotfiles -t "${HOME}" starship tmux nvim git zsh bash bin functions vscode firefox
      - name: 'stow -n -v private ssh linkage'
        run: |
          if [ -d ~/.dotfiles/private/config/ssh ]; then
            stow --no-folding -n -v -d ~/.dotfiles/private/config -t "${HOME}/.ssh" ssh
          else
            echo "private submodule not checked out, skipping ssh stow dry-run"
          fi
      - name: 'stow -n -v private bin linkage'
        run: |
          if [ -d ~/.dotfiles/private/bin ]; then
            stow --no-folding -n -v -d ~/.dotfiles/private -t "${HOME}" bin
          else
            echo "private submodule not checked out, skipping private-bin stow dry-run"
          fi

  lint:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: pre-commit/action@v3.0.1

  make:
    name: Common Make stages
    runs-on: ubuntu-latest
    steps:

      - name: '[dep] Install dependencies'
        run: sudo apt-get update && sudo apt-get install -y tmux neovim

      - uses: actions/checkout@v2
      - name: 'Clone private repos'
        run: git submodule update --init --recursive
        continue-on-error: true

      - uses: actions/checkout@v2
      - name: 'make kubernetes'
        run: make kubernetes

      # TODO: Make this work at some point
      #- uses: actions/checkout@v2
      #- name: 'Validate tmux config'
      #  run: tmux source ./config/tmux/.tmux.conf
